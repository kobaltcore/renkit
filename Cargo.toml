[package]
name = "renkit"
version = "6.1.0"
edition = "2024"
repository = "https://github.com/kobaltcore/renkit"
description = "A collection of tools to help you organise and use Ren'Py instances from the command line."
homepage = "https://github.com/kobaltcore/renkit"

[dependencies]
# System
zip = "9.0.3"
rsa = "0.9.10"
regex = "1.13.1"
base64 = "0.23.1"
anyhow = "1.0.104"
num_cpus = "1.17.0"
itertools = "0.15.0"
command-executor = "0.2.0"
tokio = { version = "1.53.3", features = ["full"] }
# this is only here because it doesn't enable profileapi
# as a feature by default, breaking the build on windows
# winapi = { version = "0.3.9", features = ["profileapi"] }
# Parsing
toml = "1.1.8"
plist = "1.10.1"
lol_html = "3.0.1"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
# Filesystem
home = "0.5.12"
tar = "0.4.46"
bzip2 = "0.6.1"
jwalk = "0.9.0"
# Internet
trauma = "3"
webbrowser = "1.2.4"
reqwest = { version = "^0.13.5", default-features = false, features = [
    "native-tls-vendored",
] }
# Apple
apple-codesign = "0.29.0"
x509-certificate = "0.25.0"
app-store-connect = "0.7.0"
# CLI
clap = { version = "4.6.7", features = ["derive"] }
indicatif = { version = "0.18.6", features = ["improved_unicode", "rayon"] }
# Images
image = "0.25.10"
rgb = "0.8.53"
imgref = "1.12.3"
ravif = { version = "0.13.0", features = [
    "threading",
], default-features = false }
webp = "0.3.1"
# webp 0.3.1 exposes 0.9.x types; newer bindings are incompatible.
libwebp-sys = { version = "0.9.6", features = ["avx2", "sse41"] }
# jpegxl-rs = { version = "0.8.3", features = ["vendored"] }
# RustPython 0.6 has broken dependency ranges; 0.5 conflicts with Apple liblzma.
# Stay on 0.4 so normal cargo updates resolve without transitive overrides.
rustpython-vm = "0.4.0"
rustpython = { version = "0.4.0", features = ["freeze-stdlib"] }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

[profile.release]
strip = true
